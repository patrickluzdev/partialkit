<div class="card">
  <div class="card-header">
    <h3 class="card-title">Delete project</h3>
    <p class="card-description">This action cannot be undone.</p>
    <div class="card-action">
      <span class="badge badge-destructive">Danger</span>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn btn-outline">Cancel</button>
    <button class="btn btn-destructive" data-pk-dialog-open="hero-dialog">Delete</button>
  </div>
</div>

<dialog class="alert-dialog" id="hero-dialog">
  <div class="alert-dialog-header">
    <h3 class="alert-dialog-title">Delete this project?</h3>
    <p class="alert-dialog-description">Every deployment and log will be removed.</p>
  </div>
  <div class="alert-dialog-footer">
    <button class="btn btn-outline" data-pk-dialog-close>Cancel</button>
    <button class="btn btn-destructive" data-pk-dialog-close="confirm">Delete</button>
  </div>
</dialog>
