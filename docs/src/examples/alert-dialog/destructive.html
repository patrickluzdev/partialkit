<button class="btn btn-destructive" data-pk-dialog-open="ad-destructive">Delete account</button>

<dialog class="alert-dialog" id="ad-destructive">
  <div class="alert-dialog-header">
    <div class="alert-dialog-media">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
      </svg>
    </div>
    <h3 class="alert-dialog-title">Delete your account?</h3>
    <p class="alert-dialog-description">
      Every project, deployment and invoice goes with it. This cannot be undone.
    </p>
  </div>
  <div class="alert-dialog-footer">
    <button class="btn btn-outline" data-pk-dialog-close>Keep my account</button>
    <button class="btn btn-destructive" data-pk-dialog-close="confirm">Delete everything</button>
  </div>
</dialog>
