<button class="btn btn-outline" data-pk-dialog-open="revoke-access">Revoke access</button>

<dialog class="alert-dialog" id="revoke-access">
  <div class="alert-dialog-header">
    <div class="alert-dialog-media">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path>
      </svg>
    </div>
    <h3 class="alert-dialog-title">Revoke access?</h3>
    <p class="alert-dialog-description">
      This member loses access immediately and any tokens they created stop working.
    </p>
  </div>
  <div class="alert-dialog-footer">
    <button class="btn btn-outline" data-pk-dialog-close>Cancel</button>
    <button class="btn" data-pk-dialog-close="confirm">Revoke</button>
  </div>
</dialog>
