<button class="btn btn-outline" data-pk-dialog-open="ad-composition">Open</button>

<dialog class="alert-dialog" id="ad-composition">
  <div class="alert-dialog-header">
    <div class="alert-dialog-media">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 8v4M12 16h.01"></path>
      </svg>
    </div>
    <h3 class="alert-dialog-title">Title</h3>
    <p class="alert-dialog-description">The consequence, spelled out.</p>
  </div>
  <div class="alert-dialog-footer">
    <button class="btn btn-outline" data-pk-dialog-close>Cancel</button>
    <button class="btn" data-pk-dialog-close="confirm">Confirm</button>
  </div>
</dialog>
