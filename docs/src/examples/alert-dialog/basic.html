<button class="btn btn-outline" data-pk-dialog-open="ad-basic">Leave page</button>

<dialog class="alert-dialog" id="ad-basic">
  <div class="alert-dialog-header">
    <h3 class="alert-dialog-title">Leave without saving?</h3>
    <p class="alert-dialog-description">Your changes will be lost.</p>
  </div>
  <div class="alert-dialog-footer">
    <button class="btn btn-outline" data-pk-dialog-close>Stay</button>
    <button class="btn" data-pk-dialog-close="confirm">Leave</button>
  </div>
</dialog>
