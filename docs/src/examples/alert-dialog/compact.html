<button class="btn btn-outline" data-pk-dialog-open="discard-draft">Discard draft</button>

<dialog class="alert-dialog" id="discard-draft" data-size="sm">
  <div class="alert-dialog-header">
    <h3 class="alert-dialog-title">Discard draft?</h3>
    <p class="alert-dialog-description">Your unsaved changes will be lost.</p>
  </div>
  <div class="alert-dialog-footer">
    <button class="btn btn-outline" data-pk-dialog-close>Keep</button>
    <button class="btn btn-destructive" data-pk-dialog-close="confirm">Discard</button>
  </div>
</dialog>
