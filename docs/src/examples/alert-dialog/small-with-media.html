<button class="btn btn-outline" data-pk-dialog-open="ad-small-media">Open</button>

<dialog class="alert-dialog" id="ad-small-media" data-size="sm">
  <div class="alert-dialog-header">
    <div class="alert-dialog-media">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path>
      </svg>
    </div>
    <h3 class="alert-dialog-title">Delete file?</h3>
    <p class="alert-dialog-description">It will not go to the bin.</p>
  </div>
  <div class="alert-dialog-footer">
    <button class="btn btn-outline" data-pk-dialog-close>Cancel</button>
    <button class="btn btn-destructive" data-pk-dialog-close="confirm">Delete</button>
  </div>
</dialog>
