<div class="field-group">
  <div class="field">
    <label class="label" for="group-name">Project name</label>
    <input class="input" id="group-name" placeholder="partialkit" />
  </div>
  <div class="field">
    <label class="label" for="group-visibility">Visibility</label>
    <select class="native-select" id="group-visibility">
      <option>Private</option>
      <option>Public</option>
    </select>
  </div>
  <hr class="field-separator" />
  <div class="field">
    <label class="label" for="group-notes">Notes</label>
    <textarea class="textarea" id="group-notes" placeholder="Anything worth remembering"></textarea>
  </div>
</div>
