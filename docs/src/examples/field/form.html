<form class="field-group">
  <fieldset class="field-set">
    <legend class="field-legend" data-variant="label">Contact</legend>

    <div class="field">
      <label class="label" for="form-email">Email</label>
      <input class="input" id="form-email" type="email" required />
    </div>

    <div class="field">
      <label class="label" for="form-phone">Phone</label>
      <input class="input" id="form-phone" type="tel" />
      <p class="field-description">Optional, for delivery updates only.</p>
    </div>
  </fieldset>

  <hr class="field-separator" />

  <div class="field">
    <label class="label" for="form-notes">Notes</label>
    <textarea class="textarea" id="form-notes"></textarea>
  </div>

  <button class="btn" type="submit">Save</button>
</form>
