<div class="field-group">

    <input class="input" id="validation-email" value="not-an-email" aria-invalid="true"
           aria-describedby="validation-email-error" />

  <div class="field">
    <label class="label" for="validation-name">Name</label>
    <input class="input" id="validation-name" value="Ada" />

  </div>
</div>
