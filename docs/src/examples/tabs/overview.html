<div class="tabs" style="width: 24rem">
  <div class="tabs-list">
    <button class="tabs-trigger" type="button" data-value="account">Account</button>
    <button class="tabs-trigger" type="button" data-value="password">Password</button>
  </div>

  <div class="tabs-content">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Account</h3>
        <p class="card-description">Make changes to your account here.</p>
      </div>
      <div class="card-content">
        <div class="field-group">
          <div class="field">
            <label class="label" for="tabs-name">Name</label>
            <input class="input" id="tabs-name" value="Ada Lovelace" />
          </div>
          <div class="field">
            <label class="label" for="tabs-username">Username</label>
            <input class="input" id="tabs-username" value="@ada" />
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn">Save changes</button>
      </div>
    </div>
  </div>

  <div class="tabs-content">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Password</h3>
        <p class="card-description">Change your password here.</p>
      </div>
      <div class="card-content">
        <div class="field-group">
          <div class="field">
            <label class="label" for="tabs-current">Current password</label>
            <input class="input" id="tabs-current" type="password" />
          </div>
          <div class="field">
            <label class="label" for="tabs-new">New password</label>
            <input class="input" id="tabs-new" type="password" />
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button class="btn">Save password</button>
      </div>
    </div>
  </div>
</div>
