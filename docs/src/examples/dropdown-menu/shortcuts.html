<button class="btn btn-outline" popovertarget="shortcuts-menu">Edit</button>

<div class="dropdown-menu" id="shortcuts-menu" popover style="width: 14rem">
  <button class="dropdown-menu-item" type="button">
    Undo <span class="dropdown-menu-shortcut">⌘Z</span>
  </button>
  <button class="dropdown-menu-item" type="button">
    Redo <span class="dropdown-menu-shortcut">⇧⌘Z</span>
  </button>
  <hr class="dropdown-menu-separator" />
  <button class="dropdown-menu-item" type="button">
    Find <span class="dropdown-menu-shortcut">⌘F</span>
  </button>
</div>
