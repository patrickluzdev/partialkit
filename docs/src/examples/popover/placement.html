<button class="btn btn-outline" popovertarget="popover-top">Top</button>
<div class="popover" id="popover-top" popover data-pk-placement="top" style="width: 12rem">
  <p class="popover-description">Opens above the trigger.</p>
</div>

<button class="btn btn-outline" popovertarget="popover-start">Start</button>
<div class="popover" id="popover-start" popover data-pk-placement="left-start" style="width: 12rem">
  <p class="popover-description">Opens at the leading edge.</p>
</div>

<button class="btn btn-outline" popovertarget="popover-end">End</button>
<div class="popover" id="popover-end" popover data-pk-placement="right-start" style="width: 12rem">
  <p class="popover-description">Opens at the trailing edge.</p>
</div>
