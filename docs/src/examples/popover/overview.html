<button class="btn btn-outline" popovertarget="demo-popover">Open popover</button>

<div class="popover" id="demo-popover" popover data-pk-placement="bottom">
  <div class="popover-header">
    <h4 class="popover-title">Dimensions</h4>
    <p class="popover-description">Set the dimensions for the layer.</p>
  </div>

  <div class="field-group">
    <div class="field" data-orientation="horizontal">
      <label class="label" for="popover-width">Width</label>
      <input class="input input-sm" id="popover-width" value="100%" style="width: 8rem" />
    </div>
    <div class="field" data-orientation="horizontal">
      <label class="label" for="popover-max-width">Max. width</label>
      <input class="input input-sm" id="popover-max-width" value="300px" style="width: 8rem" />
    </div>
    <div class="field" data-orientation="horizontal">
      <label class="label" for="popover-height">Height</label>
      <input class="input input-sm" id="popover-height" value="25px" style="width: 8rem" />
    </div>
  </div>
</div>
