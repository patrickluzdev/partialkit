<button class="btn btn-outline" popovertarget="popover-form">Share</button>

<div class="popover" id="popover-form" popover data-pk-placement="bottom" style="width: 20rem">
  <div class="popover-header">
    <h4 class="popover-title">Share this document</h4>
    <p class="popover-description">Anyone with the link can view it.</p>
  </div>

  <div class="input-group">
    <input class="input input-group-control" id="popover-link" value="partialkit.dev/docs" readonly />
    <span class="input-group-addon" data-align="inline-end">
      <button class="btn btn-ghost btn-icon-sm" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="14" height="14" x="8" y="8" rx="2"></rect>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
        </svg>
        <span class="sr-only">Copy link</span>
      </button>
    </span>
  </div>
</div>
