<form class="field-group">
  <div class="field">
    <label class="label" for="input-form-email">Email</label>
    <input class="input" id="input-form-email" type="email" required />
  </div>
  <div class="field">
    <label class="label" for="input-form-password">Password</label>
    <input class="input" id="input-form-password" type="password" required />
    <p class="field-description">At least 12 characters.</p>
  </div>
  <button class="btn" type="submit">Sign in</button>
</form>
