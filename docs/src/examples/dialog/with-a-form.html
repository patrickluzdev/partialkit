<button class="btn" data-pk-dialog-open="form-dialog">Rename project</button>

<dialog class="dialog" id="form-dialog">
  <div class="dialog-header">
    <h3 class="dialog-title">Rename project</h3>
  </div>
  <div class="field">
    <label class="label" for="dialog-name">Name</label>
    <input class="input" id="dialog-name" value="partialkit" />
  </div>
  <div class="dialog-footer">
    <button class="btn btn-outline" data-pk-dialog-close>Cancel</button>
    <button class="btn" data-pk-dialog-close="save">Save</button>
  </div>
</dialog>
