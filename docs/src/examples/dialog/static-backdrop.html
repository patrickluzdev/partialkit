<button class="btn" data-pk-dialog-open="static-dialog">Open static dialog</button>

<dialog class="dialog" id="static-dialog" data-pk-dialog-static>
  <div class="dialog-header">
    <h3 class="dialog-title">Unsaved changes</h3>
    <p class="dialog-description">Clicking outside will not close this one.</p>
  </div>
  <div class="dialog-footer">
    <button class="btn" data-pk-dialog-close>Got it</button>
  </div>
</dialog>
