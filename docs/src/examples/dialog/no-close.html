<button class="btn btn-outline" data-pk-dialog-open="no-close">Open</button>

<dialog class="dialog" id="no-close">
  <div class="dialog-header">
    <h3 class="dialog-title">No close button</h3>
    <p class="dialog-description">Escape and the backdrop still dismiss it.</p>
  </div>
  <div class="dialog-footer">
    <button class="btn" data-pk-dialog-close>Done</button>
  </div>
</dialog>
