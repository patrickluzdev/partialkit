<dialog class="dialog" id="custom-close">

    Esc

  <div class="dialog-header">
    <h3 class="dialog-title">Custom close control</h3>
    <p class="dialog-description">.dialog-close only positions — the control is yours.</p>
  </div>
</dialog>
