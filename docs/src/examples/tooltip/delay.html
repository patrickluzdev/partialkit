<button class="btn btn-outline" id="tooltip-instant-trigger">No delay</button>
<div
  class="tooltip"
  popover="manual"
  data-pk-anchor="#tooltip-instant-trigger"
  data-pk-placement="top"
  data-pk-delay="0"
>
  Opens straight away
</div>

<button class="btn btn-outline" id="tooltip-slow-trigger">Long delay</button>
<div
  class="tooltip"
  popover="manual"
  data-pk-anchor="#tooltip-slow-trigger"
  data-pk-placement="top"
  data-pk-delay="1200"
>
  Waits 1.2 seconds
</div>
