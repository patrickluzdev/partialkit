<div style="display: grid; justify-items: center; gap: 0.75rem; padding: 1rem 5rem">
  <button class="btn btn-outline" id="tooltip-top-trigger">Top</button>
  <div class="tooltip" popover="manual" data-pk-anchor="#tooltip-top-trigger" data-pk-placement="top">Top</div>

  <div style="display: flex; gap: 7rem">
    <button class="btn btn-outline" id="tooltip-start-trigger">Start</button>
    <div class="tooltip" popover="manual" data-pk-anchor="#tooltip-start-trigger" data-pk-placement="left">Start</div>

    <button class="btn btn-outline" id="tooltip-end-trigger">End</button>
    <div class="tooltip" popover="manual" data-pk-anchor="#tooltip-end-trigger" data-pk-placement="right">End</div>
  </div>

  <button class="btn btn-outline" id="tooltip-bottom-trigger">Bottom</button>
  <div class="tooltip" popover="manual" data-pk-anchor="#tooltip-bottom-trigger" data-pk-placement="bottom">Bottom</div>
</div>
