<button class="btn btn-outline" data-pk-dialog-open="sheet-top">Top</button>
<button class="btn btn-outline" data-pk-dialog-open="sheet-right">Right</button>
<button class="btn btn-outline" data-pk-dialog-open="sheet-bottom">Bottom</button>
<button class="btn btn-outline" data-pk-dialog-open="sheet-left">Left</button>

<dialog class="sheet" id="sheet-top" data-side="top">
  <div class="sheet-header">
    <h3 class="sheet-title">Top</h3>
    <p class="sheet-description">Press Escape to close.</p>
  </div>
</dialog>

<dialog class="sheet" id="sheet-right" data-side="right">
  <div class="sheet-header">
    <h3 class="sheet-title">Right</h3>
    <p class="sheet-description">Press Escape to close.</p>
  </div>
</dialog>

<dialog class="sheet" id="sheet-bottom" data-side="bottom">
  <div class="sheet-header">
    <h3 class="sheet-title">Bottom</h3>
    <p class="sheet-description">Press Escape to close.</p>
  </div>
</dialog>

<dialog class="sheet" id="sheet-left" data-side="left">
  <div class="sheet-header">
    <h3 class="sheet-title">Left</h3>
    <p class="sheet-description">Press Escape to close.</p>
  </div>
</dialog>
