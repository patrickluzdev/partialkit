<form class="card">
  <div class="card-header">
    <h3 class="card-title">Create account</h3>
    <p class="card-description">Enter your details below.</p>
  </div>
  <div class="card-content">
    <div class="field-group">
      <div class="field">
        <label class="label" for="card-form-email">Email</label>
        <input class="input" id="card-form-email" type="email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label class="label" for="card-form-password">Password</label>
        <input class="input" id="card-form-password" type="password" />
      </div>
    </div>
  </div>
  <div class="card-footer">
    <button class="btn" type="submit">Create</button>
  </div>
</form>
